name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Mail2SNMP.sln

      - name: Build
        run: dotnet build Mail2SNMP.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Mail2SNMP.sln --no-build --configuration Release --verbosity normal --filter "Category!=Docker"


  # The Windows job above excludes Category=Docker, so until now the SQL Server tests ran
  # nowhere at all -- and they are the only ones that exercise the documented production
  # provider at runtime. A suite that reports green without ever reaching SQL Server is how
  # the 1.1.0 schema defect (C-2) shipped. Service containers need a Linux runner, hence a
  # separate job; every project targets plain net8.0, so they build there.
  sqlserver-tests:
    runs-on: ubuntu-latest

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          # Throwaway credential for an ephemeral container on an ephemeral runner.
          # Not a secret, and deliberately not stored as one: a repository secret here
          # would imply it guards something.
          MSSQL_SA_PASSWORD: 'Ci-Only-Pa55w0rd!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci-Only-Pa55w0rd! -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Mail2SNMP.sln

      - name: Build
        run: dotnet build Mail2SNMP.sln --no-restore --configuration Release

      - name: Run SQL Server integration tests
        env:
          MAIL2SNMP_TEST_SQLSERVER: 'Server=localhost,1433;Database=mail2snmp_ci;User Id=sa;Password=Ci-Only-Pa55w0rd!;TrustServerCertificate=True;Encrypt=False'
        run: |
          set -o pipefail
          dotnet test Mail2SNMP.sln --no-build --configuration Release \
            --filter "Category=Docker" --verbosity normal | tee test-output.txt

      - name: Fail if the tests skipped instead of running
        run: |
          # The whole point of this job is that these tests actually execute. Skipping is
          # their failure mode, not a neutral outcome -- without this guard the job would
          # go green while reaching SQL Server exactly as often as before: never.
          #
          # Matched loosely on purpose: `dotnet test` prints a one-line summary at minimal
          # verbosity ("Passed! - Failed: 0, Passed: 6, Skipped: 0") and a multi-line one at
          # normal verbosity ("Total tests: 6" / "Passed: 6"). Keying on the counts alone
          # works for both; keying on the one-line form does not, which is how this guard
          # first failed a run whose tests had all passed.
          if grep -qiE 'Skipped: *[1-9]' test-output.txt; then
            echo "::error::SQL Server tests were SKIPPED. They must run in this job."
            grep -iE 'skipped|No SQL Server available' test-output.txt || true
            exit 1
          fi
          if ! grep -qiE 'Passed: *[1-9]' test-output.txt; then
            echo "::error::No SQL Server test reported as passed."
            tail -30 test-output.txt || true
            exit 1
          fi
          grep -iE 'Total tests|Passed:' test-output.txt | tail -3
          echo "SQL Server integration tests ran against a real server."
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, sqlserver-tests]
    runs-on: windows-latest
    # Gating the job on the "production" GitHub environment causes the
    # OIDC token issued by GitHub to carry the subject claim
    #   repo:IT-Consulting-Kinner/Mail2SNMP_Server:environment:production
    # which the Azure App Registration has a matching Federated Credential
    # for. This is the canonical workaround for Azure FIC not supporting
    # wildcards on refs/tags/v* — one credential covers every future release
    # tag without having to add a new FIC per version.
    environment: production
    permissions:
      contents: write
      # Azure Trusted Signing uses workload-identity federation; the action
      # exchanges this token for an Azure AD access token. Without id-token:write
      # the federated credential cannot be issued and signing fails.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          # Ensure 4-part version for WiX (e.g. 1.2.3 -> 1.2.3.0)
          IFS='.' read -ra PARTS <<< "$TAG"
          while [ ${#PARTS[@]} -lt 4 ]; do PARTS+=("0"); done
          FOUR="${PARTS[0]}.${PARTS[1]}.${PARTS[2]}.${PARTS[3]}"
          echo "version_four=${FOUR}" >> "$GITHUB_OUTPUT"

      - name: Publish Worker
        run: >
          dotnet publish src/Mail2SNMP.Worker/Mail2SNMP.Worker.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output ./publish/worker
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version_four }}
          -p:FileVersion=${{ steps.version.outputs.version_four }}
          -p:InformationalVersion=${{ steps.version.outputs.version }}

      # H-6: the MSI used to ship the Worker alone, so a clean install had a running
      # service but no way to configure it: no management UI, no /setup wizard for the
      # first admin, and no CLI to run the `mail2snmp db migrate` that the upgrade
      # instructions mandate. Every documented workflow was unreachable without a
      # source build. UI and CLI are now published into subfolders of the same payload
      # root, so the installer's recursive Files include picks them up and the signing
      # step (files-folder-recurse: true) covers them.
      - name: Publish management UI
        run: >
          dotnet publish src/Mail2SNMP.Web/Mail2SNMP.Web.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output ./publish/worker/ui
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version_four }}
          -p:FileVersion=${{ steps.version.outputs.version_four }}
          -p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Publish CLI
        run: >
          dotnet publish src/Mail2SNMP.Cli/Mail2SNMP.Cli.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output ./publish/worker/cli
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ steps.version.outputs.version }}
          -p:AssemblyVersion=${{ steps.version.outputs.version_four }}
          -p:FileVersion=${{ steps.version.outputs.version_four }}
          -p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Install WiX Toolset
        run: dotnet tool install --global wix

      - name: Update installer version
        shell: pwsh
        run: |
          $file = "installer/Mail2SNMP.Installer/Package.wxs"
          $content = Get-Content $file -Raw
          $content = $content -replace 'Version="1\.0\.0\.0"', "Version=`"${{ steps.version.outputs.version_four }}`""
          Set-Content $file $content

      # ── Azure Trusted Signing — binary pre-sign ────────────────────────────
      # Sign every first-party EXE and DLL in the publish output BEFORE the MSI
      # is built. Without this the MSI is a signed wrapper around unsigned
      # binaries, and Defender/SmartScreen rejects the extracted Worker service
      # on first start even though the MSI itself is trusted. The same Azure
      # Trusted Signing identity + certificate profile is used for the binaries
      # and the MSI, so there is only one signer in the final Authenticode
      # chain.
      - name: Azure login (OIDC) — for binary signing
        uses: azure/login@v2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          allow-no-subscriptions: true

      - name: Sign Worker binaries with Azure Trusted Signing
        uses: azure/trusted-signing-action@v0.5.1
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: ./publish/worker
          files-folder-filter: exe,dll
          files-folder-recurse: true
          # Exclude the hundreds of shared third-party DLLs we don't own. The
          # regex only matches our own assemblies so Microsoft.*, Serilog.*,
          # MailKit.* etc. stay untouched (they're already signed by their
          # original publisher). H-6: the character classes make the match
          # case-insensitive so the renamed CLI executable (mail2snmp.exe) is
          # signed too — '^Mail2SNMP\.' would have skipped it silently.
          files-folder-filter-regex: '^[Mm]ail2[Ss][Nn][Mm][Pp]'
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Restore Installer dependencies
        run: dotnet restore installer/Mail2SNMP.Installer/Mail2SNMP.Installer.wixproj

      - name: Build MSI
        shell: pwsh
        run: |
          $publishDir = (Resolve-Path "./publish/worker").Path + "\"
          dotnet build installer/Mail2SNMP.Installer/Mail2SNMP.Installer.wixproj --no-restore --configuration Release -p:DefineConstants="PublishDir=$publishDir"

      - name: Find MSI artifact
        id: msi
        shell: bash
        run: |
          # azure/trusted-signing-action requires an ABSOLUTE path in `files:`
          # — relative paths raise "file path … is not rooted". We turn the
          # find result into a full Windows-style path via cygpath so the
          # .NET SignTool wrapper inside the action accepts it.
          MSI=$(find installer -name "*.msi" | head -1)
          MSI_ABS=$(cygpath -w "$(readlink -f "$MSI")")
          echo "path=${MSI_ABS}" >> "$GITHUB_OUTPUT"
          echo "name=Mail2SNMP-${{ steps.version.outputs.version }}.msi" >> "$GITHUB_OUTPUT"
          echo "Resolved MSI path: ${MSI_ABS}"

      # ── Azure Trusted Signing — MSI outer wrapper ─────────────────────────
      # Re-use the Azure login from the binary pre-sign step above; the access
      # token is still valid at this point so no second azure/login call is
      # needed. Sign the MSI as the outer Authenticode wrapper — Defender and
      # SmartScreen check both the MSI itself and the binaries it installs,
      # and Wave R/S hardened the binary signing so the whole chain is now
      # covered end-to-end.
      - name: Sign MSI with Azure Trusted Signing
        uses: azure/trusted-signing-action@v0.5.1
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files: ${{ steps.msi.outputs.path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify MSI signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature -FilePath "${{ steps.msi.outputs.path }}"
          Write-Host "Status:        $($sig.Status)"
          Write-Host "Signer:        $($sig.SignerCertificate.Subject)"
          Write-Host "Issuer:        $($sig.SignerCertificate.Issuer)"
          Write-Host "TimestamperBy: $($sig.TimeStamperCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            Write-Error "MSI signature is not valid: $($sig.Status) — $($sig.StatusMessage)"
            exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.msi.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
